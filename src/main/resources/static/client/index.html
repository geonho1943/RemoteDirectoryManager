<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Directory Manager 로그인</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/login.css">
</head>
<body class="page-login">
<div id="loading-bar" class="loading-bar"></div>
<div id="toast-container" class="toast-container"></div>

<main class="login-screen">
    <section class="login-card shell-card">
        <div class="login-card-head">
            <div>
                <div class="eyebrow">Remote Directory Manager</div>
                <p class="login-subtitle">디렉터리 탐색, 업로드, 미리보기, Tags 관리를 안전하게 이용하세요.</p>
            </div>
        </div>

        <div class="login-copy">
            <p>이 서비스는 서버와 같은 주소에서 실행되므로 API Key만 입력하면 됩니다.</p>
        </div>

        <form id="loginForm" class="login-form" novalidate>
            <label class="field-group">
                <span class="field-label">API Key</span>
                <input
                    id="apiKeyInput"
                    class="text-input"
                    type="password"
                    autocomplete="current-password"
                    placeholder="API Key를 입력하세요"
                >
            </label>

            <button id="connectButton" class="btn btn-primary btn-block" type="submit">연결</button>
            <p id="loginError" class="inline-error hidden" role="alert"></p>
        </form>
    </section>
</main>

<script type="module" src="./assets/js/pages/login.js"></script>
</body>
</html>
